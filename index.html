<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學快算判斷挑戰</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts: Noto Sans TC 與 JetBrains Mono (等寬數字呈現) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .math-font {
            font-family: 'JetBrains Mono', 'Noto Sans TC', monospace;
            font-variant-numeric: tabular-nums;
        }

        /* 分數堆疊排版樣式 */
        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            margin: 0 0.25em;
            font-size: 0.72em;
            line-height: 1.15;
        }
        .fraction .num {
            border-bottom: 3px solid currentColor;
            padding: 0 0.3em 0.1em 0.3em;
            width: 100%;
            text-align: center;
        }
        .fraction .den {
            padding: 0.1em 0.3em 0 0.3em;
            width: 100%;
            text-align: center;
        }

        /* 動畫效果：答對脈衝、答錯震動、浮動分數 */
        @keyframes pulseGreen {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.45); border-color: #10b981; }
            70% { box-shadow: 0 0 0 14px rgba(16, 185, 129, 0); border-color: #10b981; }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @keyframes shakeRed {
            0%, 100% { transform: translateX(0); border-color: #ef4444; }
            20%, 60% { transform: translateX(-8px); border-color: #ef4444; }
            40%, 80% { transform: translateX(8px); border-color: #ef4444; }
        }

        @keyframes floatUpFade {
            0% { opacity: 1; transform: translate(-50%, 0) scale(0.9); }
            20% { opacity: 1; transform: translate(-50%, -12px) scale(1.1); }
            100% { opacity: 0; transform: translate(-50%, -48px) scale(1); }
        }

        .anim-correct {
            animation: pulseGreen 0.45s ease-out;
        }

        .anim-wrong {
            animation: shakeRed 0.4s ease-in-out;
        }

        .floating-score {
            position: absolute;
            left: 50%;
            top: 15%;
            pointer-events: none;
            font-weight: 800;
            animation: floatUpFade 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            z-index: 30;
        }

        /* 按鈕立體按壓感 */
        .btn-tactile {
            transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.15s ease;
        }
        .btn-tactile:active {
            transform: translateY(3px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between py-4 px-3 sm:py-6 sm:px-6 bg-slate-100">

    <!-- 頂部標題與控制列 -->
    <header class="w-full max-w-2xl flex flex-col gap-3">
        <div class="flex flex-wrap items-center justify-between gap-2 bg-white px-4 py-3 rounded-2xl shadow-sm border border-slate-200/80">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-black text-lg shadow-sm">
                    ±×
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold text-slate-800 leading-tight">數學快算判斷挑戰</h1>
                    <p class="text-xs text-slate-500">判斷算式真偽 · 連對累加 · 連錯倒扣</p>
                </div>
            </div>

            <!-- 模式與計時切換 -->
            <div class="flex items-center gap-2">
                <button id="timerToggleBtn" onclick="toggleTimerMode()" class="px-3 py-1.5 rounded-xl text-xs font-bold border transition flex items-center gap-1.5 bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100">
                    <span id="timerIcon">⏱️</span>
                    <span id="timerModeText">休閒無限時</span>
                </button>
                <button onclick="resetGame()" title="重新開始" class="p-1.5 rounded-xl text-slate-500 hover:text-slate-800 hover:bg-slate-100 border border-transparent hover:border-slate-200 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- 難度階段選擇標籤 (Tabs) -->
        <div class="bg-white p-1.5 rounded-2xl shadow-sm border border-slate-200/80 flex overflow-x-auto gap-1 no-scrollbar">
            <button data-stage="auto" onclick="selectStage('auto')" class="stage-tab flex-1 min-w-[84px] py-1.5 px-2.5 rounded-xl text-xs sm:text-sm font-bold transition bg-indigo-600 text-white shadow-sm">
                自動進階
            </button>
            <button data-stage="1" onclick="selectStage('1')" class="stage-tab flex-1 min-w-[76px] py-1.5 px-2.5 rounded-xl text-xs sm:text-sm font-bold transition text-slate-600 hover:bg-slate-100">
                1. 基礎運算
            </button>
            <button data-stage="2" onclick="selectStage('2')" class="stage-tab flex-1 min-w-[76px] py-1.5 px-2.5 rounded-xl text-xs sm:text-sm font-bold transition text-slate-600 hover:bg-slate-100">
                2. 多位數
            </button>
            <button data-stage="3" onclick="selectStage('3')" class="stage-tab flex-1 min-w-[76px] py-1.5 px-2.5 rounded-xl text-xs sm:text-sm font-bold transition text-slate-600 hover:bg-slate-100">
                3. 小數計算
            </button>
            <button data-stage="4" onclick="selectStage('4')" class="stage-tab flex-1 min-w-[76px] py-1.5 px-2.5 rounded-xl text-xs sm:text-sm font-bold transition text-slate-600 hover:bg-slate-100">
                4. 分數計算
            </button>
        </div>
    </header>

    <!-- 中央遊戲主體區 -->
    <main class="w-full max-w-2xl flex-1 flex flex-col justify-center my-3 gap-4">
        
        <!-- 數據儀表板：當前分數、連擊狀態、最高紀錄 -->
        <div class="grid grid-cols-3 gap-2.5 sm:gap-4">
            <!-- 當前分數 -->
            <div class="bg-white rounded-2xl p-3 sm:p-4 shadow-sm border border-slate-200/80 flex flex-col items-center justify-center">
                <span class="text-xs font-medium text-slate-400">目前分數</span>
                <span id="scoreDisplay" class="math-font text-2xl sm:text-3xl font-extrabold text-slate-800 mt-0.5">0</span>
            </div>

            <!-- 連擊 / 連錯狀態指示 -->
            <div id="streakCard" class="bg-white rounded-2xl p-3 sm:p-4 shadow-sm border border-slate-200/80 flex flex-col items-center justify-center transition-colors">
                <span class="text-xs font-medium text-slate-400">目前狀態</span>
                <span id="streakDisplay" class="text-sm sm:text-base font-extrabold text-slate-600 mt-1 text-center">準備開始</span>
            </div>

            <!-- 最高紀錄 / 倒數計時 -->
            <div class="bg-white rounded-2xl p-3 sm:p-4 shadow-sm border border-slate-200/80 flex flex-col items-center justify-center">
                <span id="rightStatLabel" class="text-xs font-medium text-slate-400">最高紀錄</span>
                <span id="rightStatValue" class="math-font text-2xl sm:text-3xl font-extrabold text-amber-500 mt-0.5">0</span>
            </div>
        </div>

        <!-- 算式展示主卡片 -->
        <div id="equationCard" class="relative bg-white rounded-3xl shadow-md border-2 border-slate-200/90 p-6 sm:p-10 flex flex-col items-center justify-center min-h-[220px] sm:min-h-[260px] transition-all">
            
            <!-- 浮動得分提示容器 -->
            <div id="floatingContainer" class="inset-0 pointer-events-none overflow-hidden rounded-3xl"></div>

            <!-- 頂部標籤：目前關卡等級與本題獎懲預告 -->
            <div class="w-full flex items-center justify-between text-xs font-bold mb-4">
                <span id="currentLevelBadge" class="px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-700 border border-indigo-100">
                    Lv.1 基礎加減乘除
                </span>
                <div class="flex items-center gap-2">
                    <span id="nextRewardBadge" class="px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200/70">
                        答對 +10
                    </span>
                    <span id="nextPenaltyBadge" class="px-2 py-0.5 rounded bg-rose-50 text-rose-600 border border-rose-200/70">
                        答錯歸零
                    </span>
                </div>
            </div>

            <!-- 算式核心顯示區 -->
            <div id="equationDisplay" class="math-font text-3xl sm:text-5xl md:text-6xl font-extrabold text-slate-800 tracking-tight text-center my-auto py-4 select-all">
                12 + 7 = 19
            </div>

            <!-- 上一題解答回饋提示 (答錯時顯示正確答案幫助學習) -->
            <div id="feedbackHint" class="h-6 mt-2 text-xs sm:text-sm font-bold text-center transition-opacity opacity-0">
                <!-- 動態填入提示 -->
            </div>
        </div>

        <!-- 操作按鈕區：正確 (O) / 錯誤 (X) -->
        <div class="grid grid-cols-2 gap-3 sm:gap-5 pt-1">
            <button id="btnTrue" onclick="handleAnswer(true)" class="btn-tactile group relative bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white rounded-2xl py-4 sm:py-5 px-4 shadow-md shadow-emerald-500/20 border-b-4 border-emerald-700 flex flex-col items-center justify-center gap-1 cursor-pointer">
                <div class="flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 sm:w-8 sm:h-8 stroke-[3]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <circle cx="12" cy="12" r="9" />
                    </svg>
                    <span class="text-xl sm:text-2xl font-black tracking-wide">正確</span>
                </div>
                <span class="text-[11px] sm:text-xs text-emerald-100 font-medium">鍵盤 ← 或 O / Y</span>
            </button>

            <button id="btnFalse" onclick="handleAnswer(false)" class="btn-tactile group relative bg-rose-500 hover:bg-rose-600 active:bg-rose-700 text-white rounded-2xl py-4 sm:py-5 px-4 shadow-md shadow-rose-500/20 border-b-4 border-rose-700 flex flex-col items-center justify-center gap-1 cursor-pointer">
                <div class="flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 sm:w-8 sm:h-8 stroke-[3]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                    <span class="text-xl sm:text-2xl font-black tracking-wide">錯誤</span>
                </div>
                <span class="text-[11px] sm:text-xs text-rose-100 font-medium">鍵盤 → 或 X / N</span>
            </button>
        </div>

    </main>

    <!-- 底部規則說明列 -->
    <footer class="w-full max-w-2xl text-center text-xs text-slate-500 bg-white/70 rounded-xl py-2.5 px-4 border border-slate-200/60">
        <span class="font-bold text-slate-700">計分規則：</span>
        連續答對每次加分遞增（+10, +20, +30...）；答錯時連擊歸零；若連續答錯將開始遞增扣分（第1次錯不扣分，第2次連錯 -10，第3次連錯 -20...）。
    </footer>

    <!-- 限時模式結算彈窗 (取代 alert) -->
    <div id="gameOverModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 sm:p-8 shadow-2xl border border-slate-100 text-center transform transition-all">
            <div class="w-16 h-16 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center mx-auto mb-4 text-3xl">
                🏁
            </div>
            <h2 class="text-2xl font-black text-slate-800">時間到！挑戰結束</h2>
            <p class="text-sm text-slate-500 mt-1">您在 60 秒快算挑戰中的成績如下</p>
            
            <div class="bg-slate-50 rounded-2xl p-4 my-5 border border-slate-200/80 grid grid-cols-2 gap-3">
                <div>
                    <div class="text-xs text-slate-400 font-medium">最終得分</div>
                    <div id="finalScoreText" class="math-font text-3xl font-black text-indigo-600 mt-0.5">0</div>
                </div>
                <div>
                    <div class="text-xs text-slate-400 font-medium">最高連對</div>
                    <div id="finalMaxStreakText" class="math-font text-3xl font-black text-emerald-600 mt-0.5">0</div>
                </div>
            </div>

            <button onclick="closeModalAndRestart()" class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-base shadow-md shadow-indigo-500/20 transition cursor-pointer">
                再挑戰一次
            </button>
        </div>
    </div>

    <script>
        /**
         * 數學快算判斷挑戰 - 核心遊戲邏輯
         */

        // 遊戲狀態變數
        const state = {
            score: 0,
            highScore: parseInt(localStorage.getItem('math_judge_highscore') || '0', 10),
            positiveStreak: 0,      // 連續答對次數
            negativeStreak: 0,      // 連續答錯次數
            maxPositiveStreak: 0,   // 單局最高連對
            totalCorrect: 0,        // 累計答對題數（用於自動進階判斷）
            selectedStage: 'auto',  // 'auto' | '1' | '2' | '3' | '4'
            currentEquation: null,  // { html: string, isTrue: boolean, correctionText: string, stage: number }
            isTimerMode: false,     // 是否開啟 60 秒倒數模式
            timeLeft: 60,
            timerInterval: null,
            isGameOver: false,
            basePoints: 10          // 基礎分值單位
        };

        // DOM 元素快取
        const el = {
            scoreDisplay: document.getElementById('scoreDisplay'),
            streakCard: document.getElementById('streakCard'),
            streakDisplay: document.getElementById('streakDisplay'),
            rightStatLabel: document.getElementById('rightStatLabel'),
            rightStatValue: document.getElementById('rightStatValue'),
            equationCard: document.getElementById('equationCard'),
            equationDisplay: document.getElementById('equationDisplay'),
            currentLevelBadge: document.getElementById('currentLevelBadge'),
            nextRewardBadge: document.getElementById('nextRewardBadge'),
            nextPenaltyBadge: document.getElementById('nextPenaltyBadge'),
            feedbackHint: document.getElementById('feedbackHint'),
            floatingContainer: document.getElementById('floatingContainer'),
            timerToggleBtn: document.getElementById('timerToggleBtn'),
            timerIcon: document.getElementById('timerIcon'),
            timerModeText: document.getElementById('timerModeText'),
            gameOverModal: document.getElementById('gameOverModal'),
            finalScoreText: document.getElementById('finalScoreText'),
            finalMaxStreakText: document.getElementById('finalMaxStreakText')
        };

        // 工具函式：隨機整數 [min, max]
        function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // 工具函式：最大公因數 (GCD)
        function gcd(a, b) {
            a = Math.abs(a);
            b = Math.abs(b);
            while (b !== 0) {
                let t = b;
                b = a % b;
                a = t;
            }
            return a;
        }

        // 工具函式：產生分數 HTML 結構
        function formatFractionHTML(num, den) {
            if (den === 1) return `${num}`;
            return `<span class="fraction"><span class="num">${num}</span><span class="den">${den}</span></span>`;
        }

        // 工具函式：產生純文字分數（用於答錯時的訂正提示）
        function formatFractionText(num, den) {
            if (den === 1) return `${num}`;
            return `${num}/${den}`;
        }

        // 決定目前應該出哪個階段的題目
        function resolveActiveStage() {
            if (state.selectedStage !== 'auto') {
                return parseInt(state.selectedStage, 10);
            }
            // 自動進階邏輯：依據累計答對題數與當前分數動態提升難度
            if (state.totalCorrect < 5 && state.score < 100) return 1;      // 基礎加減乘除
            if (state.totalCorrect < 12 && state.score < 350) return 2;     // 位數增加
            if (state.totalCorrect < 20 && state.score < 700) return 3;     // 小數計算
            return 4;                                                       // 分數計算（綜合高階）
        }

        /**
         * 題目生成器：涵蓋四個難度階段，並確保約 50% 為正確、50% 為具迷惑性的錯誤算式
         */
        function generateEquation() {
            const stage = resolveActiveStage();
            const isTrue = Math.random() < 0.5;
            let eq = null;

            switch (stage) {
                case 1:
                    eq = generateStage1Basic(isTrue);
                    break;
                case 2:
                    eq = generateStage2MultiDigit(isTrue);
                    break;
                case 3:
                    eq = generateStage3Decimals(isTrue);
                    break;
                case 4:
                    eq = generateStage4Fractions(isTrue);
                    break;
            }
            eq.stage = stage;
            return eq;
        }

        // 階段 1：基礎加減乘除 (個位數與二位數)
        function generateStage1Basic(isTrue) {
            const ops = ['+', '-', '×', '÷'];
            const op = ops[randInt(0, 3)];
            let a, b, ans, shownAns;

            if (op === '+') {
                a = randInt(3, 25);
                b = randInt(2, 25);
                ans = a + b;
            } else if (op === '-') {
                a = randInt(10, 35);
                b = randInt(2, a - 1);
                ans = a - b;
            } else if (op === '×') {
                a = randInt(2, 9);
                b = randInt(2, 9);
                ans = a * b;
            } else {
                b = randInt(2, 9);
                ans = randInt(2, 9);
                a = b * ans;
            }

            if (isTrue) {
                shownAns = ans;
            } else {
                // 製造接近的錯誤（差 1、差 2 或進位錯誤）
                const offsets = [-2, -1, 1, 2, 10];
                let offset = offsets[randInt(0, offsets.length - 1)];
                if (ans + offset < 0) offset = Math.abs(offset);
                shownAns = ans + offset;
            }

            return {
                html: `${a} ${op} ${b} = ${shownAns}`,
                isTrue,
                correctionText: `${a} ${op} ${b} = ${ans}`
            };
        }

        // 階段 2：位數增加 (二位數至三位數加減乘除)
        function generateStage2MultiDigit(isTrue) {
            const ops = ['+', '-', '×', '÷'];
            const op = ops[randInt(0, 3)];
            let a, b, ans, shownAns;

            if (op === '+') {
                a = randInt(45, 280);
                b = randInt(35, 250);
                ans = a + b;
            } else if (op === '-') {
                a = randInt(120, 450);
                b = randInt(35, a - 25);
                ans = a - b;
            } else if (op === '×') {
                a = randInt(12, 28);
                b = randInt(4, 12);
                ans = a * b;
            } else {
                b = randInt(6, 15);
                ans = randInt(11, 24);
                a = b * ans;
            }

            if (isTrue) {
                shownAns = ans;
            } else {
                // 常見多位數計算失誤：十位數進退位差 10、個位數差 1 或 2
                const offsets = [-10, -2, -1, 1, 2, 10, 20];
                let offset = offsets[randInt(0, offsets.length - 1)];
                if (ans + offset <= 0) offset = 10;
                shownAns = ans + offset;
            }

            return {
                html: `${a} ${op} ${b} = ${shownAns}`,
                isTrue,
                correctionText: `${a} ${op} ${b} = ${ans}`
            };
        }

        // 階段 3：小數計算 (精確處理浮點數誤差)
        function generateStage3Decimals(isTrue) {
            const ops = ['+', '-', '×'];
            const op = ops[randInt(0, 2)];
            let aInt, bInt, ans, shownAns, aStr, bStr;

            if (op === '+' || op === '-') {
                // 使用整數擴大 10 倍計算，徹底避免 JS 0.1 + 0.2 = 0.30000000000000004 問題
                aInt = randInt(12, 98);
                bInt = randInt(5, 85);
                if (op === '-' && aInt <= bInt) {
                    [aInt, bInt] = [bInt + randInt(5, 20), aInt];
                }
                const ansInt = op === '+' ? (aInt + bInt) : (aInt - bInt);
                aStr = (aInt / 10).toFixed(1);
                bStr = (bInt / 10).toFixed(1);
                ans = Number((ansInt / 10).toFixed(1));

                if (isTrue) {
                    shownAns = ans.toFixed(1);
                } else {
                    const offsets = [-1.0, -0.2, -0.1, 0.1, 0.2, 1.0];
                    let wrong = Number((ans + offsets[randInt(0, offsets.length - 1)]).toFixed(1));
                    if (wrong < 0) wrong = Number((ans + 0.2).toFixed(1));
                    shownAns = wrong.toFixed(1);
                }
            } else {
                // 小數乘法：例如 0.4 × 0.6 = 0.24 或 1.5 × 0.4 = 0.6
                aInt = randInt(2, 15);
                bInt = randInt(2, 9);
                const ansInt = aInt * bInt;
                aStr = (aInt / 10).toFixed(1);
                bStr = (bInt / 10).toFixed(1);
                ans = Number((ansInt / 100).toFixed(2));

                if (isTrue) {
                    shownAns = ans.toString();
                } else {
                    // 常見小數乘法錯誤：小數點點錯位（擴大10倍）或尾數差 0.02 / 0.1
                    const mistakeType = randInt(0, 2);
                    let wrong;
                    if (mistakeType === 0) {
                        wrong = Number((ans * 10).toFixed(1)); // 小數點忘記進兩位
                    } else if (mistakeType === 1) {
                        wrong = Number((ans + 0.1).toFixed(2));
                    } else {
                        wrong = Number(Math.max(0.01, ans - 0.02).toFixed(2));
                    }
                    if (wrong === ans) wrong = Number((ans + 0.04).toFixed(2));
                    shownAns = wrong.toString();
                }
            }

            return {
                html: `${aStr} ${op} ${bStr} = ${shownAns}`,
                isTrue,
                correctionText: `${aStr} ${op} ${bStr} = ${ans}`
            };
        }

        // 階段 4：分數計算 (自動約分並以標準分數線呈現)
        function generateStage4Fractions(isTrue) {
            const dens = [2, 3, 4, 5, 6, 8];
            const ops = ['+', '-', '×'];
            const op = ops[randInt(0, 2)];

            let d1 = dens[randInt(0, dens.length - 1)];
            let d2 = dens[randInt(0, dens.length - 1)];
            let n1 = randInt(1, d1 - 1);
            let n2 = randInt(1, d2 - 1);

            // 若為減法，確保結果為正數
            if (op === '-' && (n1 / d1 <= n2 / d2)) {
                [n1, d1, n2, d2] = [n2, d2, n1, d1];
                if (n1 / d1 === n2 / d2) {
                    n1 += 1;
                }
            }

            let rawNum, rawDen;
            if (op === '+') {
                rawNum = n1 * d2 + n2 * d1;
                rawDen = d1 * d2;
            } else if (op === '-') {
                rawNum = n1 * d2 - n2 * d1;
                rawDen = d1 * d2;
            } else {
                rawNum = n1 * n2;
                rawDen = d1 * d2;
            }

            const common = gcd(rawNum, rawDen);
            const ansNum = rawNum / common;
            const ansDen = rawDen / common;

            let shownNum = ansNum;
            let shownDen = ansDen;

            if (!isTrue) {
                // 製造常見分數錯誤：分子分母直接相加、分子差 1、或分母錯誤
                const errType = randInt(0, 2);
                if (errType === 0 && op !== '×') {
                    // 常見迷思：分子加分子、分母加分母
                    const naiveNum = op === '+' ? (n1 + n2) : Math.max(1, Math.abs(n1 - n2));
                    const naiveDen = d1 + d2;
                    const g = gcd(naiveNum, naiveDen);
                    shownNum = naiveNum / g;
                    shownDen = naiveDen / g;
                } else if (errType === 1) {
                    shownNum = ansNum + (Math.random() < 0.5 ? 1 : -1);
                    if (shownNum <= 0) shownNum = ansNum + 2;
                    shownDen = ansDen;
                } else {
                    shownNum = ansNum;
                    shownDen = ansDen + (Math.random() < 0.5 ? 1 : 2);
                }

                // 確保錯誤答案確實不等於正確答案
                if (shownNum * ansDen === ansNum * shownDen) {
                    shownNum += 1;
                }
            }

            const leftHTML = `${formatFractionHTML(n1, d1)} ${op} ${formatFractionHTML(n2, d2)}`;
            const rightHTML = formatFractionHTML(shownNum, shownDen);

            return {
                html: `${leftHTML} = ${rightHTML}`,
                isTrue,
                correctionText: `${formatFractionText(n1, d1)} ${op} ${formatFractionText(n2, d2)} = ${formatFractionText(ansNum, ansDen)}`
            };
        }

        /**
         * 計算下一題答對與答錯的分數變化預告
         */
        function getNextScoreDeltas() {
            // 答對獎勵：連對次數 + 1 乘以基礎分 (10, 20, 30...)
            const nextGain = (state.positiveStreak + 1) * state.basePoints;

            // 答錯懲罰：若目前正處於連對狀態或剛開始(negativeStreak === 0)，第一次答錯歸零(0分)；
            // 若已經答錯過(negativeStreak >= 1)，連續答錯則扣分遞增 (-10, -20, -30...)
            const nextPenalty = state.negativeStreak === 0 ? 0 : -(state.negativeStreak * state.basePoints);

            return { nextGain, nextPenalty };
        }

        /**
         * 處理玩家點擊「正確 (O)」或「錯誤 (X)」
         */
        function handleAnswer(userChoice) {
            if (state.isGameOver || !state.currentEquation) return;

            const isCorrect = (userChoice === state.currentEquation.isTrue);
            let delta = 0;

            // 重置卡片動畫 class 以便重新觸發
            el.equationCard.classList.remove('anim-correct', 'anim-wrong');
            void el.equationCard.offsetWidth; // 強制 reflow

            if (isCorrect) {
                // 答對邏輯：重置連錯、累加連對、計算遞增得分
                state.negativeStreak = 0;
                state.positiveStreak += 1;
                state.totalCorrect += 1;
                if (state.positiveStreak > state.maxPositiveStreak) {
                    state.maxPositiveStreak = state.positiveStreak;
                }

                delta = state.positiveStreak * state.basePoints;
                state.score += delta;

                // 更新最高分紀錄
                if (state.score > state.highScore) {
                    state.highScore = state.score;
                    localStorage.setItem('math_judge_highscore', state.highScore.toString());
                }

                el.equationCard.classList.add('anim-correct');
                spawnFloatingScore(`+${delta}`, 'text-emerald-500');
                showFeedbackHint('✓ 判斷正確！', 'text-emerald-600');
            } else {
                // 答錯邏輯：
                // 若原本在連對中，先斷掉連對，本次計為第 1 次錯誤（不扣分，下次答對從最低分 10 分重新累加）
                // 若原本已經在連錯狀態（negativeStreak >= 1），則觸發連續答錯遞增扣分
                state.positiveStreak = 0;
                state.negativeStreak += 1;

                if (state.negativeStreak === 1) {
                    delta = 0;
                    spawnFloatingScore('連擊中斷 (0)', 'text-amber-500');
                } else {
                    delta = -((state.negativeStreak - 1) * state.basePoints);
                    state.score += delta;
                    spawnFloatingScore(`${delta}`, 'text-rose-500');
                }

                el.equationCard.classList.add('anim-wrong');
                showFeedbackHint(`✗ 答錯了！正確算式為：${state.currentEquation.correctionText}`, 'text-rose-600');
            }

            // 產生下一題並更新畫面
            state.currentEquation = generateEquation();
            updateUI();
        }

        // 在算式卡片上方產生浮動得分文字
        function spawnFloatingScore(text, colorClass) {
            const badge = document.createElement('div');
            badge.className = `floating-score math-font text-2xl sm:text-3xl ${colorClass}`;
            badge.textContent = text;
            el.floatingContainer.appendChild(badge);
            setTimeout(() => {
                badge.remove();
            }, 850);
        }

        // 顯示上一題回饋提示
        function showFeedbackHint(text, colorClass) {
            el.feedbackHint.textContent = text;
            el.feedbackHint.className = `h-6 mt-2 text-xs sm:text-sm font-bold text-center transition-opacity opacity-100 ${colorClass}`;
        }

        // 更新整體畫面 UI
        function updateUI() {
            // 1. 分數顯示
            el.scoreDisplay.textContent = state.score;
            el.scoreDisplay.className = `math-font text-2xl sm:text-3xl font-extrabold mt-0.5 ${
                state.score < 0 ? 'text-rose-600' : 'text-slate-800'
            }`;

            // 2. 連對 / 連錯狀態顯示
            if (state.positiveStreak > 0) {
                el.streakDisplay.textContent = `🔥 連對 x${state.positiveStreak}`;
                el.streakDisplay.className = 'text-sm sm:text-base font-extrabold text-emerald-600 mt-1 text-center';
                el.streakCard.className = 'bg-emerald-50/60 rounded-2xl p-3 sm:p-4 shadow-sm border border-emerald-200 flex flex-col items-center justify-center transition-colors';
            } else if (state.negativeStreak >= 2) {
                el.streakDisplay.textContent = `⚠️ 連錯 x${state.negativeStreak}`;
                el.streakDisplay.className = 'text-sm sm:text-base font-extrabold text-rose-600 mt-1 text-center';
                el.streakCard.className = 'bg-rose-50/70 rounded-2xl p-3 sm:p-4 shadow-sm border border-rose-200 flex flex-col items-center justify-center transition-colors';
            } else if (state.negativeStreak === 1) {
                el.streakDisplay.textContent = '連擊歸零';
                el.streakDisplay.className = 'text-sm sm:text-base font-extrabold text-amber-600 mt-1 text-center';
                el.streakCard.className = 'bg-amber-50/60 rounded-2xl p-3 sm:p-4 shadow-sm border border-amber-200 flex flex-col items-center justify-center transition-colors';
            } else {
                el.streakDisplay.textContent = '準備開始';
                el.streakDisplay.className = 'text-sm sm:text-base font-extrabold text-slate-600 mt-1 text-center';
                el.streakCard.className = 'bg-white rounded-2xl p-3 sm:p-4 shadow-sm border border-slate-200/80 flex flex-col items-center justify-center transition-colors';
            }

            // 3. 右側欄位（最高分 或 剩餘秒數）
            if (state.isTimerMode) {
                el.rightStatLabel.textContent = '剩餘時間';
                el.rightStatValue.textContent = `${state.timeLeft}s`;
                el.rightStatValue.className = `math-font text-2xl sm:text-3xl font-extrabold mt-0.5 ${
                    state.timeLeft <= 10 ? 'text-rose-600 animate-pulse' : 'text-indigo-600'
                }`;
            } else {
                el.rightStatLabel.textContent = '最高紀錄';
                el.rightStatValue.textContent = state.highScore;
                el.rightStatValue.className = 'math-font text-2xl sm:text-3xl font-extrabold text-amber-500 mt-0.5';
            }

            // 4. 關卡徽章與獎懲預告
            const stageNames = {
                1: 'Lv.1 基礎加減乘除',
                2: 'Lv.2 多位數進階',
                3: 'Lv.3 小數精確運算',
                4: 'Lv.4 分數約分挑戰'
            };
            const currentStage = state.currentEquation.stage;
            const prefix = state.selectedStage === 'auto' ? '自動進階 · ' : '指定練習 · ';
            el.currentLevelBadge.textContent = prefix + stageNames[currentStage];

            const { nextGain, nextPenalty } = getNextScoreDeltas();
            el.nextRewardBadge.textContent = `答對 +${nextGain}`;
            el.nextPenaltyBadge.textContent = nextPenalty === 0 ? '答錯歸零' : `答錯 ${nextPenalty}`;

            // 5. 渲染當前算式 HTML
            el.equationDisplay.innerHTML = state.currentEquation.html;
        }

        // 切換難度標籤
        function selectStage(stageKey) {
            state.selectedStage = stageKey;
            document.querySelectorAll('.stage-tab').forEach(btn => {
                if (btn.dataset.stage === stageKey) {
                    btn.className = 'stage-tab flex-1 min-w-[76px] py-1.5 px-2.5 rounded-xl text-xs sm:text-sm font-bold transition bg-indigo-600 text-white shadow-sm';
                } else {
                    btn.className = 'stage-tab flex-1 min-w-[76px] py-1.5 px-2.5 rounded-xl text-xs sm:text-sm font-bold transition text-slate-600 hover:bg-slate-100';
                }
            });
            state.currentEquation = generateEquation();
            updateUI();
        }

        // 切換「休閒無限時」與「限時 60 秒挑戰」
        function toggleTimerMode() {
            state.isTimerMode = !state.isTimerMode;
            if (state.isTimerMode) {
                el.timerIcon.textContent = '🔥';
                el.timerModeText.textContent = '限時 60 秒';
                el.timerToggleBtn.className = 'px-3 py-1.5 rounded-xl text-xs font-bold border transition flex items-center gap-1.5 bg-indigo-50 text-indigo-700 border-indigo-200 hover:bg-indigo-100';
            } else {
                el.timerIcon.textContent = '⏱️';
                el.timerModeText.textContent = '休閒無限時';
                el.timerToggleBtn.className = 'px-3 py-1.5 rounded-xl text-xs font-bold border transition flex items-center gap-1.5 bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100';
            }
            resetGame();
        }

        // 啟動計時器
        function startTimer() {
            clearInterval(state.timerInterval);
            if (!state.isTimerMode) return;

            state.timeLeft = 60;
            state.timerInterval = setInterval(() => {
                state.timeLeft -= 1;
                updateUI();
                if (state.timeLeft <= 0) {
                    endTimedGame();
                }
            }, 1000);
        }

        // 結束限時遊戲並顯示結算視窗
        function endTimedGame() {
            clearInterval(state.timerInterval);
            state.isGameOver = true;
            el.finalScoreText.textContent = state.score;
            el.finalMaxStreakText.textContent = `x${state.maxPositiveStreak}`;
            el.gameOverModal.classList.remove('hidden');
            el.gameOverModal.classList.add('flex');
        }

        function closeModalAndRestart() {
            el.gameOverModal.classList.add('hidden');
            el.gameOverModal.classList.remove('flex');
            resetGame();
        }

        // 重置遊戲狀態
        function resetGame() {
            clearInterval(state.timerInterval);
            state.score = 0;
            state.positiveStreak = 0;
            state.negativeStreak = 0;
            state.maxPositiveStreak = 0;
            state.totalCorrect = 0;
            state.isGameOver = false;
            el.feedbackHint.classList.add('opacity-0');
            state.currentEquation = generateEquation();
            if (state.isTimerMode) {
                startTimer();
            }
            updateUI();
        }

        // 鍵盤快捷鍵支援 (左方向鍵/O/Y 為正確，右方向鍵/X/N 為錯誤)
        window.addEventListener('keydown', (e) => {
            if (state.isGameOver) return;
            const key = e.key.toLowerCase();
            if (e.key === 'ArrowLeft' || key === 'o' || key === 'y') {
                e.preventDefault();
                handleAnswer(true);
            } else if (e.key === 'ArrowRight' || key === 'x' || key === 'n') {
                e.preventDefault();
                handleAnswer(false);
            }
        });

        // 頁面載入完成後初始化第一題
        window.onload = function () {
            resetGame();
        };
    </script>
</body>
